name: Android Multi-ABI Build (newbuild)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build newscan (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            elf_class: ELF64
            machine: AArch64
            linker: /system/bin/linker64
          - abi: armeabi-v7a
            elf_class: ELF32
            machine: ARM
            linker: /system/bin/linker

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Check build tools
        run: |
          cmake --version
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure CMake
        run: |
          cmake -S . -B "build-${{ matrix.abi }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28

      - name: Compile
        run: cmake --build "build-${{ matrix.abi }}" --parallel 2

      - name: Verify Android executable architecture
        run: |
          set -eu
          test -f outputs/newscan
          test -x outputs/newscan
          file outputs/newscan
          readelf -h outputs/newscan | grep -F "${{ matrix.elf_class }}"
          readelf -h outputs/newscan | grep -F "${{ matrix.machine }}"
          readelf -l outputs/newscan | grep -F "${{ matrix.linker }}"
          echo "${{ matrix.abi }} executable checks passed."

      - name: Package build
        run: |
          mkdir -p artifacts
          cp outputs/newscan "artifacts/newscan-${{ matrix.abi }}"
          sha256sum "artifacts/newscan-${{ matrix.abi }}" > artifacts/SHA256SUMS.txt
          {
            echo "Platform: Android ${{ matrix.abi }}"
            echo "ELF class: ${{ matrix.elf_class }}"
            echo "Build type: Release"
            echo "NDK: 25.2.9519653"
            echo "C++ standard: C++17"
            echo "Commit: $GITHUB_SHA"
          } > artifacts/BUILD-INFO.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: PointerScan-Android-${{ matrix.abi }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
