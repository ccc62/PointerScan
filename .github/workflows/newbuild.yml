name: Android ARM64 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build newscan (arm64-v8a)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Check build tools
        run: |
          cmake --version
          g++ --version
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Compile
        run: |
          cmake --build build --parallel 2

      - name: Verify Android ARM64 executable
        run: |
          set -eu

          test -f outputs/newscan
          test -x outputs/newscan

          echo "=== File type ==="
          file outputs/newscan

          echo "=== ELF architecture ==="
          readelf -h outputs/newscan | grep -E 'Class:|Machine:'

          echo "=== Android dynamic linker ==="
          readelf -l outputs/newscan | grep -F '/system/bin/linker64'

          echo "Android ARM64 executable checks passed."

      - name: Package build
        run: |
          mkdir -p artifacts
          cp outputs/newscan artifacts/newscan-arm64
          sha256sum artifacts/newscan-arm64 \
            > artifacts/SHA256SUMS.txt
          {
            echo "Platform: Android arm64-v8a"
            echo "Build type: Release"
            echo "NDK: 25.2.9519653"
            echo "C++ standard: C++17"
            echo "Commit: $GITHUB_SHA"
          } > artifacts/BUILD-INFO.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: PointerScan-Android-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
